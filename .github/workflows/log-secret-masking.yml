name: Log Secret Masking

on:
  pull_request:
    paths:
      - "helpers/log.py"
      - "helpers/log.py.dox.md"
      - "tests/test_log_secret_masking.py"
      - ".github/workflows/log-secret-masking.yml"
  push:
    branches:
      - main
    paths:
      - "helpers/log.py"
      - "helpers/log.py.dox.md"
      - "tests/test_log_secret_masking.py"
      - ".github/workflows/log-secret-masking.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: log-secret-masking-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Nix
        uses: https://github.com/cachix/install-nix-action@v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log masking security regression
        run: nix develop --command pytest -q tests/test_log_secret_masking.py
