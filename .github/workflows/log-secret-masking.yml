name: Log Secret Masking

on:
  pull_request:
    paths:
      - "helpers/log.py"
      - "helpers/log.py.dox.md"
      - "tests/test_log_secret_masking.py"
      - "nix/**"
      - ".github/workflows/log-secret-masking.yml"
  push:
    branches:
      - main
    paths:
      - "helpers/log.py"
      - "helpers/log.py.dox.md"
      - "tests/test_log_secret_masking.py"
      - "nix/**"
      - ".github/workflows/log-secret-masking.yml"
  workflow_dispatch:

permissions:
  contents: read

# Sandboxed builds keep each derivation's HOME isolated; without this the
# unsandboxed rust/cargo bootstrap chain leaves /homeless-shelter behind and
# later builds fail their purity check on the root single-user CI runner.
env:
  NIX_CONFIG: |-
    sandbox = true

concurrency:
  group: heavy-ci-${{ github.repository }}
  cancel-in-progress: false
jobs:
  regression:
    runs-on: nix
    timeout-minutes: 75
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify host nix
        run: nix --version

      - name: Log masking security regression
        run: nix develop --command pytest -q tests/test_log_secret_masking.py
