name: Zara bridge focused test

on:
  push:
    branches:
      - feat/zara-bridge-66

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - name: Run focused Zara bridge tests
        run: python -m pytest -q plugins/_zara_bridge/tests
