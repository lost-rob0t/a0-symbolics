name_pattern: "*.promptinclude.md"
max_depth: 3
max_file_tokens: 750
max_file_count: 8
max_total_tokens: 1500
gitignore: |
  venv/**
  **/__pycache__/**
  **/node_modules/**
  **/.npm/**
  **/.git/**
  **/.conda/**
  **/.cache/**
  **/dist/**
  **/build/**
  **/.tox/**
  **/.eggs/**
  **/*.egg-info/**
